<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bozeman Snow Report</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%238ec3e6'/><g stroke='%23fff8e7' stroke-width='3' stroke-linecap='round' fill='none'><g id='a'><path d='M32 32V9M32 17l-6-5M32 17l6-5M32 25l-4-3M32 25l4-3'/></g><use href='%23a' transform='rotate(60 32 32)'/><use href='%23a' transform='rotate(120 32 32)'/><use href='%23a' transform='rotate(180 32 32)'/><use href='%23a' transform='rotate(240 32 32)'/><use href='%23a' transform='rotate(300 32 32)'/></g><circle cx='32' cy='32' r='3' fill='%23fff8e7'/></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Iceland&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet"><style>body{font-family:'Barlow',sans-serif}h1,h2,h3,h4,h5,h6,title,.title{font-family:'Iceland',sans-serif;letter-spacing:.05em}</style>
  <style>
      #map { height: 450px; }
      .shade-tint { filter: contrast(0.6) url(#alpine-tint); }
      .leaflet-container { background: #e6eff5; }
      :root { --ink: #1b3a5c; --paper: #f7f1e3; }
      body { font-family: 'Barlow', sans-serif; color: var(--ink); background: var(--paper); }
      .range-label span {
        display: block;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        font-family: 'Iceland', sans-serif;
        font-size: 18px;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      }
      .town-label span {
        display: block;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        font-family: 'Barlow', sans-serif;
        font-size: 12px;
        letter-spacing: .15em;
        text-transform: uppercase;
        color: #df5206;
        text-shadow: 0 0 3px #fff, 0 0 3px #fff;
      }
      h1 {
        font-size: 3.5rem;
        text-align: center;
      }
      h2 {
        font-size: 2.5rem;
        text-align: center;
      }
      #current {
        width: fit-content;
        font-size: 1.1rem;
        margin: 0 auto;
      }
      .station-flake {
        font-size: 32px;
        line-height: 32px;
        text-align: center;
        color: var(--ink);
        text-shadow: 0 0 3px #fff, 0 0 3px #fff;
        cursor: pointer;
      }
      .deepest-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 10px 16px;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(27, 58, 92, .25);
        font: 14px 'Barlow', sans-serif;   /* buttons don't inherit fonts */
        text-align: left;
        cursor: pointer;
      }
      .deepest-card:hover { background: #fff; }
      .deepest-card .label {
        font-family: 'Iceland', sans-serif;
        text-transform: uppercase;
        letter-spacing: .15em;
      }
      .deepest-card .depth {
        font-family: 'Iceland', sans-serif;
        font-size: 44px;
        line-height: 1;
      }
      .deepest-card .depth small { font-size: 20px; }
      .deepest-card .name { font-weight: 700; font-size: 16px; }
      .deepest-card .date { font-size: 12px; opacity: .75; }

      /* Make the winning snowflake stand out on the map */
      .station-flake.deepest {
        color: #fff;
        font-size: 40px;
        text-shadow: 0 0 3px var(--ink), 0 0 6px var(--ink);
      }
      @media (max-width: 600px) {
        body { margin: 0 12px; }

        h1 { font-size: 2.2rem; margin: 16px 0 8px; }
        h2 { font-size: 1.5rem; }

        #map { height: 60vh; }   /* most of the screen, leaving room to scroll past */

        #current { font-size: 1rem; }

        .range-label span { font-size: 12px; letter-spacing: .1em; }

        .deepest-card { padding: 6px 10px; }
        .deepest-card .depth { font-size: 32px; }
        .deepest-card .name { font-size: 14px; }
      }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <filter id="alpine-tint" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.365 0.902"/>
        <feFuncG type="table" tableValues="0.518 0.937"/>
        <feFuncB type="table" tableValues="0.659 0.961"/>
      </feComponentTransfer>
    </filter>
  </svg>
  <h1>Bozeman Snow Report</h1>
  <div id="map"></div>

  <h2 id="station-name">Click a station on the map to see this water year's snow depth!</h2>
  <div id="current"></div>
  <div id="precip-chart"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
